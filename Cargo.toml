[package]
name = "autonomous-systems-vv-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A deterministic verification lab for a small 2D ground vehicle simulator"

[[bin]]
name = "vv-lab"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
